# 小臭玩AI — 真后端探针 nightly（v4.286.0「第四层测试」）
#
# 背景：edge-tts 403 / Agnes 端点迁移两次事故的共同形状是「昨天还好好的，
# 今天悄悄坏了，而测试层一片绿」——unit/判据/扰动三层全是 monkeypatch 假
# handler，没有一层真的去调外部后端。本 workflow 补上这一层。
#
# 与日常 CI（ci.yml）的分工：
#   · ci.yml 每次 push 跑 —— 快、零外部依赖，不碰真 API；
#   · 本 workflow 每日 + 手动跑 —— 真调 edge-tts / web_search / image_gen，
#     只验「通 + 结构」，任一 FAIL 即 fail-closed 撞红（403/401 的唯一自动拦截层）。
#
# secrets（仓库 Settings → Secrets → Actions 配置，未配置的探针自动 SKIP，
# SKIP 不冒充通过——run 日志会有醒目横幅，不会假绿）：
#   PROBE_BRAVE_API_KEY   —— web_search 的 Brave key
#   PROBE_SERPER_API_KEY  —— web_search 的 Serper key（与 Brave 二选一即可）
#   PROBE_API_KEY         —— image_gen gateway/deepseek 后端的 key
#   PROBE_AGNES_API_KEY   —— image_gen agnes 后端（订阅版 cpk-）的 key

name: Real-backend probe nightly

on:
  schedule:
    # 每日 00:00 UTC = 北京时间 08:00，大哥起床前跑完，坏了当天就知道。
    - cron: "0 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: realbackend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: 真后端探针（edge-tts / web_search / image_gen）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 安装 ffmpeg（edge-tts 多段合成的拼接后端）
        run: choco install ffmpeg -y --no-progress
        shell: cmd
      - name: 跑真后端探针
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          # 探针专用 env 兜底（只进探针 cfg，不回写用户配置）：
          PROBE_BRAVE_API_KEY: ${{ secrets.PROBE_BRAVE_API_KEY }}
          PROBE_SERPER_API_KEY: ${{ secrets.PROBE_SERPER_API_KEY }}
          PROBE_API_KEY: ${{ secrets.PROBE_API_KEY }}
          PROBE_AGNES_API_KEY: ${{ secrets.PROBE_AGNES_API_KEY }}
        run: python probe_real_backend.py
