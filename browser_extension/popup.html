<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
           width: 280px; margin: 0; padding: 14px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { font-size: 12px; color: #666; display: block; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px;
            border: 1px solid #d6dbe3; border-radius: 6px; }
    textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px;
               border: 1px solid #d6dbe3; border-radius: 6px; height: 48px; resize: none; }
    button { width: 100%; margin-top: 8px; padding: 9px; font-size: 13px;
             border: none; border-radius: 8px; cursor: pointer; }
    .primary { background: #1A73E8; color: #fff; }
    .ghost { background: #eef2f8; color: #1A73E8; }
    .status { font-size: 12px; margin-top: 10px; min-height: 16px; }
    .ok { color: #1a9e3e; }
    .err { color: #d33; }
    .tip { font-size: 11px; color: #999; margin-top: 8px; line-height: 1.5; }
    code { background: #eef2f8; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>📎 Agent抓网页</h1>

  <label>配对码（从Agent设置里复制）</label>
  <input id="token" type="text" placeholder="粘贴Agent显示的配对码" autocomplete="off">

  <label>附言（可选，发给Agent的指令，如「总结要点」）</label>
  <textarea id="note" placeholder="例如：提取里面的表格"></textarea>

  <button class="primary" id="capture">抓取当前页正文</button>
  <button class="ghost" id="captureSel">抓取选中文字</button>

  <div class="status" id="status"></div>
  <div class="tip">
    桥接地址 <code>127.0.0.1:9100</code>。先在Agent「设置 → 浏览器扩展」里
    复制配对码填到上面。抓取后内容会进Agent输入框，按发送即可让 AI 处理。
  </div>

  <script src="popup.js"></script>
</body>
</html>
